<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Subtle Court Lines -->
  <path d="M 56 380 L 456 380" stroke="#38bdf8" stroke-width="6" stroke-dasharray="16 12" opacity="0.35" />

  <!-- Volleyball Graphic -->
  <g filter="url(#shadow)" transform="translate(256, 240)">
    <circle r="150" fill="url(#ballGrad)" />
    <!-- Blue panel accents -->
    <path d="M -146 -35 C -60 -95, 60 -95, 146 -35 C 120 -115, 50 -150, 0 -150 C -50 -150, -120 -115, -146 -35 Z" fill="url(#blueGrad)" />
    <path d="M -110 102 C -30 40, 55 55, 138 58 C 105 120, 45 150, 0 150 C -45 150, -85 130, -110 102 Z" fill="#ffffff" opacity="0.92" />

    <!-- Seam lines -->
    <circle r="148" fill="none" stroke="#0f172a" stroke-width="10" />
    <path d="M -146 -35 C -60 -95, 60 -95, 146 -35" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <path d="M -148 15 C -40 -40, 65 -35, 148 12" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <path d="M -110 102 C -30 40, 55 55, 138 58" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <path d="M 0 -148 C -45 -40, -35 55, 12 148" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <path d="M 72 -130 C 35 -30, 45 55, 85 122" fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <path d="M -72 -130 C -95 -35, -85 50, -55 136" fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Scoreboard Pill at Bottom -->
  <g transform="translate(256, 428)">
    <rect x="-120" y="-34" width="240" height="68" rx="20" fill="#0f172a" stroke="#facc15" stroke-width="5" />
    <text x="-52" y="13" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#facc15" text-anchor="middle">15</text>
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" fill="#64748b" text-anchor="middle">×</text>
    <text x="52" y="13" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#38bdf8" text-anchor="middle">13</text>
  </g>
</svg>

